name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Stage site without repository metadata
        run: |
          mkdir -p /tmp/site
          rsync -a --exclude .git --exclude .github ./ /tmp/site/

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: /tmp/site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
